  <!-- ─── Page Wrapper ─────────────────────────────────────────── -->
  <main class="page" id="main-content">

    <!-- ━━━ TERMINAL VIEW ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
    <section id="terminal-view" aria-label="Interactive Terminal">
      <div class="terminal-window" role="application" aria-label="Linux Terminal Emulator">

        <!-- Terminal Desktop Window Titlebar -->
        <header class="terminal-titlebar">
          <div class="window-controls">
            <button class="win-btn win-btn-close" id="btn-win-close" title="Cerrar / Volver al menú" aria-label="Close"></button>
            <button class="win-btn win-btn-min" id="btn-win-min" title="Limpiar pantalla" aria-label="Minimize"></button>
            <button class="win-btn win-btn-max" id="btn-win-max" title="Alternar pantalla completa" aria-label="Toggle Fullscreen"></button>
          </div>
          <div class="window-title">
            <span class="term-icon"></span>
            <span class="term-title-text" id="term-title-display">kitty — joscalejo@hyprland:~ (zsh)</span>
          </div>
          <div class="window-spacer" aria-hidden="true"></div>
        </header>

        <!-- Output & Input Flow -->
        <div class="term-body" id="terminal-body" role="log" aria-live="polite" aria-label="Terminal output">
          <div id="terminal-output"></div>

          <!-- Input Row with Zsh-style Ghost Autosuggestion -->
          <div class="input-row" id="input-line">
            <span class="ps1" id="cli-prompt" aria-hidden="true"><span class="acc1">joscalejo</span><span class="dim" style="display:inline-block;margin:0 1.5px;">@</span><span class="acc2">hyprland</span><span class="dim">:</span><span class="acc3">~</span><span class="ps1-char">$</span></span>
            <div class="input-field-container">
              <input
                type="text"
                id="cli-input"
                class="cli-input"
                autocomplete="off"
                spellcheck="false"
                autocorrect="off"
                autocapitalize="off"
                autofocus
                aria-label="Terminal command input"
                placeholder=""
              >
              <div id="cli-ghost-text" class="cli-ghost-text" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
