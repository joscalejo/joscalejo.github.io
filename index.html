<!DOCTYPE html>
<html lang="es" data-theme="obsidian">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>José Callejo (joscalejo) | Linux Terminal CV & Portfolio</title>
  <meta name="description" content="Portafolio interactivo estilo Terminal Linux y CV de José Callejo. Desarrollador de Software.">
  <meta name="keywords" content="José Callejo, joscalejo, developer, portafolio, terminal, resume, CV, frontend, fullstack">
  <meta name="author" content="José Callejo">

  <!-- Favicon & PWA Manifest -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#10b981">

  <!-- Open Graph / Social Media Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="José Callejo | Linux Terminal CV & Portfolio">
  <meta property="og:description" content="Portafolio interactivo tipo Consola Linux y CV de José Callejo. Desarrollador de Software.">
  <meta property="og:image" content="assets/og-image.png">
  <meta property="og:url" content="https://joscalejo.github.io">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="José Callejo | Linux Terminal CV & Portfolio">
  <meta name="twitter:description" content="Portafolio interactivo tipo Consola Linux y CV de José Callejo.">
  <meta name="twitter:image" content="assets/og-image.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/terminal.css">
  <link rel="stylesheet" href="css/gui.css">
</head>
<body>

  <!-- Top Glassmorphic Navigation Bar -->
  <header class="navbar">
    <a href="#" class="brand" id="brand-logo">
      <span class="brand-dot"></span>
      <span>joscalejo@github:~$</span>
    </a>
    <div class="controls-group">
      <button id="btn-toggle-view" class="btn-control" title="Alternar entre Terminal CLI y Vista CV Gráfica">Vista CV</button>
      <button id="btn-lang" class="btn-control" title="Cambiar Idioma / Switch Language">EN</button>
      <button id="btn-theme" class="btn-control" title="Cambiar Tema Cromático">Tema</button>
      <button id="btn-pdf" class="btn-control" title="Imprimir o Guardar como PDF">PDF 🖨️</button>
    </div>
  </header>

  <!-- Main Content Wrapper -->
  <main class="main-wrapper">
    
    <!-- 1. Interactive Terminal CLI View -->
    <section id="terminal-view">
      <div class="terminal-window">
        <!-- Terminal Window Header -->
        <div class="terminal-header">
          <div class="window-buttons">
            <span class="dot dot-close"></span>
            <span class="dot dot-minimize"></span>
            <span class="dot dot-maximize"></span>
          </div>
          <div class="window-title">bash — 80x24</div>
          <div class="terminal-quick-actions" id="quick-tags-container">
            <button class="quick-tag" data-cmd="whoami">whoami</button>
            <button class="quick-tag" data-cmd="skills">skills</button>
            <button class="quick-tag" data-cmd="projects">projects</button>
            <button class="quick-tag" data-cmd="experience">experience</button>
            <button class="quick-tag" data-cmd="contact">contact</button>
            <button class="quick-tag" data-cmd="help">help</button>
          </div>
        </div>

        <!-- Terminal Body & Prompt Output -->
        <div class="terminal-body" id="terminal-body">
          <div id="terminal-output"></div>

          <!-- Active Prompt Line -->
          <div class="input-line">
            <span class="prompt-container">
              <span class="prompt-user">joscalejo</span><span class="prompt-at">@</span><span class="prompt-host">github</span>:<span class="prompt-path">~</span><span class="prompt-char">$</span>
            </span>
            <input type="text" id="cli-input" class="cmd-input" autocomplete="off" spellcheck="false" autofocus aria-label="Terminal input line">
          </div>
        </div>
      </div>
    </section>

    <!-- 2. Visual GUI CV View (Hidden by default) -->
    <section id="gui-view" style="display: none;">
      <div id="gui-content" style="width: 100%;"></div>
    </section>

  </main>

  <!-- JavaScript ESM Bundle -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
